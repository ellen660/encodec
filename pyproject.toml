[project]
name = "encodec"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops (>=0.8.1,<0.9.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)",
    "torch (>=2.7.1,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "torchaudio (>=2.7.1,<3.0.0)",
    "torchmetrics (>=1.8.0,<2.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "jsonschema (>=4.25.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.7"
black = "^25.1.0"
isort = "^6.0.1"
pyright = "^1.1.403"
torchviz = "^0.0.3"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py310"
extend-select = ["I", "F", "E", "W", "UP", "NPY"]
exclude = ["venv", ".venv", "build", "dist"]

[tool.pyright]
include = ["src"]
exclude = ["tests", ".venv"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = true